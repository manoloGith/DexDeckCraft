[package]
name = "dexdeckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "DeckCraft's desktop interface on Android (Samsung DeX, desktop windowing): the native library the Android app loads"

[lib]
name = "dexdeckcraft"
# cdylib: the library the Android activity loads; lib: the desktop binary and the tests
crate-type = ["cdylib", "lib"]

[[bin]]
# The same interface in a desktop window, to iterate without a device.
name = "dexdeckcraft-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
desktop = ["eframe/x11", "eframe/wayland"]

[dependencies]
deckcraft-engine = { path = "../../upstream/crates/engine" }
# DeckCraft's desktop interface, from the fork's `dexcraft/android` branch.
deckcraft-ui-egui = { path = "../../upstream/crates/ui-egui" }
# The audio output trait DeckCraft's media player drives.
deckcraft-media = { path = "../../upstream/crates/media" }
egui = { version = "0.37", features = ["default_fonts"] }
# wgpu draws; OpenGL ES (glow) is the fallback.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit"] }
# The clipboard's pictures reach DeckCraft as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde_json = "1"
# The shared Android layer of the Crafting Apps: input, lifecycle, pickers, clipboard, printing.
craft-android = { path = "../../craft-android/crates/craft-android" }

[target.'cfg(target_os = "android")'.dependencies]
# GameActivity (craft-android's CraftActivity), not NativeActivity: eframe's `accesskit` is only
# available with it.
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }
# Sound for the slides' audio and video (AAudio), as DeckCraft's desktop binary plays it.
cpal = "0.16"
